appId: dev.paulomanrique.iptvfreedom
productName: IPTV Freedom

directories:
  output: dist
  buildResources: build

# Bundles the arch-appropriate ffmpeg binary into Resources (used to remux live
# recordings to MP4). See build/afterPack.cjs.
afterPack: build/afterPack.cjs

# The UI is already bundled by electron-vite into out/. The main process uses
# only native Node/Electron modules, so node_modules does not need to be included.
files:
  - out/**
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: IPTV-Freedom-${version}-windows-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.entertainment
  artifactName: IPTV-Freedom-${version}-mac-${arch}.${ext}

linux:
  maintainer: Paulo Manrique <paulo.manrique@pm.me>
  category: AudioVideo
  synopsis: Desktop IPTV client for Xtream Codes providers
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  artifactName: IPTV-Freedom-${version}-linux-${arch}.${ext}
