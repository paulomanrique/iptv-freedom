<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IPTV Freedom — Modelo 4 (Compacto)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{accent:'#0a84ff'},fontSize:{'2xs':'11px'}}}}</script>
<style>
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;overflow:hidden;
    background:radial-gradient(900px 600px at 100% 0%,#2a2340 0%,transparent 55%),#0b0d13}
  .glass{background:rgba(22,24,32,.7);backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%)}
  .bar{background:rgba(16,18,24,.7);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%)}
  .poster{background-size:cover;background-position:center}
  .scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:8px}.scroll::-webkit-scrollbar-track{background:transparent}
  .row:hover{background:rgba(255,255,255,.05)}
  .row.sel{background:rgba(10,132,255,.22)}
  .side.active{background:rgba(255,255,255,.09);color:#fff}
</style>
</head>
<body class="text-white/85 antialiased text-[13px]">

<div class="h-screen w-screen p-3">
  <div class="glass h-full w-full rounded-2xl border border-white/10 shadow-[0_30px_80px_-20px_rgba(0,0,0,.85)] overflow-hidden flex flex-col">

    <!-- Toolbar -->
    <div class="bar h-11 shrink-0 flex items-center px-3 gap-3 border-b border-white/10">
      <div class="flex items-center gap-2"><span class="h-3 w-3 rounded-full bg-[#ff5f57]"></span><span class="h-3 w-3 rounded-full bg-[#febc2e]"></span><span class="h-3 w-3 rounded-full bg-[#28c840]"></span></div>
      <div class="flex items-center gap-1 ml-2 text-white/40"><button class="h-7 w-7 grid place-items-center rounded-md hover:bg-white/10">‹</button><button class="h-7 w-7 grid place-items-center rounded-md hover:bg-white/10">›</button></div>
      <div class="font-semibold text-white/70 text-2xs uppercase tracking-wider" id="crumb">Filmes</div>
      <div class="flex-1"></div>
      <!-- view toggle -->
      <div class="bar flex rounded-lg p-0.5 border border-white/10">
        <button id="vList" onclick="setView('list')" class="h-6 w-7 grid place-items-center rounded-md bg-white/15"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
        <button id="vGrid" onclick="setView('grid')" class="h-6 w-7 grid place-items-center rounded-md text-white/50"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
      </div>
      <div class="relative w-56"><svg class="absolute left-2.5 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-white/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="search" placeholder="Buscar…" class="w-full bg-white/10 focus:bg-white/15 rounded-md pl-8 pr-3 py-1.5 text-2xs outline-none focus:ring-2 ring-accent/60"/></div>
    </div>

    <div class="flex-1 flex min-h-0">
      <!-- Sidebar -->
      <aside class="w-52 shrink-0 bar border-r border-white/10 flex flex-col py-2 scroll overflow-y-auto">
        <div class="px-3 py-2 flex items-center gap-2.5">
          <div class="h-8 w-8 rounded-lg bg-gradient-to-br from-accent to-fuchsia-500 grid place-items-center text-2xs font-bold">A1</div>
          <div class="min-w-0"><div class="text-2xs font-semibold truncate">a1a12.com</div><div class="text-[10px] text-emerald-400">● Ativa · 24/06</div></div>
        </div>
        <div class="px-3 pt-3 pb-1 text-[10px] uppercase tracking-wider text-white/35">Biblioteca</div>
        <div id="side" class="px-2 space-y-0.5"></div>
        <div class="px-3 pt-4 pb-1 text-[10px] uppercase tracking-wider text-white/35">Categorias</div>
        <div class="px-2 space-y-0.5 text-2xs text-white/65">
          ${['Lançamentos 2026','Ação','Marvel e DC','Cinema','Terror & Suspense','Comédia','Ficção'].map(g=>`<div class="px-3 py-1.5 rounded-md hover:bg-white/10 cursor-pointer flex items-center gap-2"><span class="h-2 w-2 rounded-sm bg-white/25"></span>${g}</div>`).join('')}
        </div>
      </aside>

      <!-- Lista -->
      <section id="list" class="flex-1 min-w-0 scroll overflow-y-auto"></section>

      <!-- Painel de prévia -->
      <aside id="preview" class="w-80 shrink-0 bar border-l border-white/10 scroll overflow-y-auto"></aside>
    </div>

    <!-- Barra de downloads inferior -->
    <div class="bar h-9 shrink-0 border-t border-white/10 flex items-center px-3 gap-3 text-2xs text-white/55">
      <svg class="h-3.5 w-3.5 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>
      <span><b class="text-white/80">O Falsário (2026)</b> · 62% · 8,4 MB/s</span>
      <div class="w-40 h-1 rounded-full bg-white/10 overflow-hidden"><div class="h-full bg-accent" style="width:62%"></div></div>
      <span class="text-white/35">+1 na fila</span>
      <div class="flex-1"></div>
      <span class="text-amber-300/70">1 conexão (limite do provedor)</span>
    </div>
  </div>
</div>

<div id="player" class="hidden fixed inset-0 z-50 grid place-items-center p-6"><div class="absolute inset-0 bg-black/85" onclick="closePlayer()"></div><div class="relative w-full max-w-5xl rounded-2xl overflow-hidden border border-white/10 shadow-2xl bg-black"></div></div>
<div id="toast" class="hidden fixed bottom-12 left-1/2 -translate-x-1/2 z-[60] glass border border-white/10 rounded-lg px-4 py-2 text-2xs shadow-2xl"></div>

<script>
const PAL=[['#7b4dff','#3a1d8a'],['#ff5f6d','#7a1f3d'],['#11998e','#0a4a47'],['#f7971e','#7a4a0a'],['#2193b0','#0a3a4a'],['#cc2b5e','#5a1230'],['#42275a','#1a0f2a'],['#005c97','#0a2a4a'],['#dd5e89','#5a2540'],['#1f4037','#0a201a']];
const DATA=[
  {t:'De Férias com Você',y:2026,g:'Comédia',d:'1h52',q:'HD',sz:'1.4 GB',live:0},
  {t:'Dinheiro Suspeito',y:2026,g:'Crime',d:'2h08',q:'4K',sz:'3.1 GB',live:0},
  {t:'Caju, Meu Amigo',y:2026,g:'Família',d:'1h38',q:'HD',sz:'1.2 GB',live:0},
  {t:'O Falsário',y:2026,g:'Suspense',d:'2h11',q:'4K',sz:'2.1 GB',live:0},
  {t:'Verdade e Traição',y:2026,g:'Drama',d:'1h59',q:'1080p',sz:'1.8 GB',live:0},
  {t:'Um Dia Extraordinário',y:2026,g:'Drama',d:'1h44',q:'HD',sz:'1.3 GB',live:0},
  {t:'Davi: Nasce Um Rei',y:2026,g:'Épico',d:'2h14',q:'4K',sz:'3.4 GB',live:0},
  {t:'Dupla Perigosa',y:2026,g:'Ação',d:'1h57',q:'4K',sz:'1.7 GB',live:0},
  {t:'Cidade em Chamas',y:2025,g:'Ação',d:'2h03',q:'4K',sz:'2.4 GB',live:0},
  {t:'Protocolo Zero',y:2025,g:'Ficção',d:'2h20',q:'4K',sz:'3.0 GB',live:0},
  {t:'Noite Sem Fim',y:2025,g:'Terror',d:'1h41',q:'HD',sz:'1.1 GB',live:0},
  {t:'Vingança Fria',y:2024,g:'Ação',d:'1h49',q:'1080p',sz:'1.6 GB',live:0},
];
const LIVE=['Globo HD','SporTV 2','Telecine Action','HBO Max 24h','ESPN Brasil','Premiere Clubes','Discovery','GloboNews','Cartoon Network','Band Sports'];
const SIDE=[['movies','Filmes','8.412'],['series','Séries','2.103'],['live','Ao vivo','312'],['downloads','Downloads','2'],['accounts','Contas','1']];
let view='list', mode='movies', sel=0;

function thumb(i,cls){const[a,b]=PAL[i%PAL.length];return `<div class="poster ${cls} rounded-md ring-1 ring-white/10 shrink-0" style="background:linear-gradient(150deg,${a},${b})"></div>`;}
function buildSide(){document.getElementById('side').innerHTML=SIDE.map(([k,l,n])=>`<div onclick="nav('${k}')" data-side="${k}" class="side px-3 py-1.5 rounded-md hover:bg-white/10 cursor-pointer flex items-center justify-between"><span>${l}</span><span class="text-[10px] text-white/35">${n}</span></div>`).join('');document.querySelectorAll('[data-side]').forEach(n=>n.classList.toggle('active',n.dataset.side===mode));}

function renderList(){
  const el=document.getElementById('list');
  if(mode==='live'){
    el.innerHTML=`<div class="divide-y divide-white/5">${LIVE.concat(LIVE).map((c,i)=>`<div class="row flex items-center gap-3 px-4 py-2 cursor-pointer" onclick="openPlayer('${c}')">${thumb(i,'h-8 w-8')}<div class="flex-1 min-w-0"><div class="font-medium truncate">${c}</div></div><span class="text-[10px] text-red-400 flex items-center gap-1"><span class="h-1.5 w-1.5 rounded-full bg-red-500"></span>LIVE</span></div>`).join('')}</div>`;
    document.getElementById('preview').innerHTML=previewLive();return;
  }
  if(mode==='downloads'){el.innerHTML=dlList();document.getElementById('preview').innerHTML='<div class="p-5 text-2xs text-white/45">Fila de downloads. Limite de 1 conexão simultânea — itens rodam um a um.</div>';return;}
  if(mode==='accounts'){el.innerHTML=accountsList();document.getElementById('preview').innerHTML=previewAccount();return;}
  const rows=DATA.map((m,i)=>view==='list'
    ? `<div class="row sel-able flex items-center gap-3 px-4 py-2 cursor-pointer ${i===sel?'sel':''}" onclick="select(${i})">${thumb(i,'h-9 w-6')}
        <div class="flex-1 min-w-0"><div class="font-medium truncate">${m.t}</div><div class="text-[10px] text-white/40">${m.g}</div></div>
        <div class="w-12 text-2xs text-white/45 text-center">${m.y}</div>
        <div class="w-14 text-2xs text-white/45 text-center">${m.d}</div>
        <div class="w-12 text-2xs text-center"><span class="border border-white/20 rounded px-1">${m.q}</span></div>
        <div class="w-16 text-2xs text-white/45 text-right">${m.sz}</div></div>`
    : `<div class="cursor-pointer group" onclick="select(${i})">${thumb(i,'aspect-[2/3] w-full')}<div class="text-2xs font-medium truncate mt-1">${m.t}</div><div class="text-[10px] text-white/40">${m.y} · ${m.q}</div></div>`).join('');
  el.innerHTML = view==='list'
    ? `<div class="sticky top-0 bar text-[10px] uppercase tracking-wider text-white/40 flex items-center gap-3 px-4 py-2 border-b border-white/10"><span class="w-6"></span><span class="flex-1">Título</span><span class="w-12 text-center">Ano</span><span class="w-14 text-center">Duração</span><span class="w-12 text-center">Qual.</span><span class="w-16 text-right">Tamanho</span></div><div class="divide-y divide-white/5">${rows}</div>`
    : `<div class="grid grid-cols-[repeat(auto-fill,minmax(120px,1fr))] gap-3 p-4">${rows}</div>`;
  select(sel);
}
function select(i){sel=i;document.querySelectorAll('#list .sel-able').forEach((r,idx)=>r.classList.toggle('sel',idx===i&&view==='list'));document.getElementById('preview').innerHTML=previewMovie(DATA[i],i);}

function previewMovie(m,i){const[a,b]=PAL[i%PAL.length];return `<div class="p-4"><div class="poster aspect-[2/3] w-full rounded-xl ring-1 ring-white/10 mb-4" style="background:linear-gradient(150deg,${a},${b})"></div>
  <h2 class="text-base font-bold leading-tight">${m.t}</h2>
  <div class="flex flex-wrap items-center gap-2 text-[10px] text-white/45 mt-1.5"><span class="text-emerald-400">96%</span><span>${m.y}</span><span>${m.d}</span><span class="border border-white/20 rounded px-1">${m.q}</span><span>${m.g}</span></div>
  <p class="text-2xs text-white/60 mt-3 leading-relaxed">Sinopse: produção ${m.y} em ${m.q}, ${m.d} de duração. Áudio 5.1, legendas PT/EN.</p>
  <div class="flex flex-col gap-2 mt-4">
    <button onclick="openPlayer('${m.t.replace(/'/g,'')}')" class="bg-white text-black font-semibold rounded-lg py-2 text-2xs flex items-center justify-center gap-2"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Assistir</button>
    <button onclick="download('${m.t.replace(/'/g,'')}')" class="bg-white/12 hover:bg-white/20 font-semibold rounded-lg py-2 text-2xs flex items-center justify-center gap-2"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>Baixar arquivo · ${m.sz}</button>
  </div>
  <div class="mt-4 pt-4 border-t border-white/10 text-[10px] text-white/40 space-y-1.5">
    <div class="flex justify-between"><span>Contêiner</span><span class="text-white/65">mp4</span></div>
    <div class="flex justify-between"><span>Resolução</span><span class="text-white/65">${m.q==='4K'?'3840×2160':'1920×1080'}</span></div>
    <div class="flex justify-between"><span>Tamanho</span><span class="text-white/65">${m.sz}</span></div>
  </div></div>`;}
function previewLive(){return `<div class="p-5 text-2xs text-white/55"><div class="font-semibold text-white/80 text-sm mb-2">Canais ao vivo</div>Streams em MPEG-TS reproduzidos via mpegts.js. Selecione um canal para abrir o player.<div class="mt-4 p-3 rounded-lg bg-amber-400/10 text-amber-300/80 text-[10px]">Não é possível baixar conteúdo ao vivo — apenas filmes e séries (VOD).</div></div>`;}
function previewAccount(){return `<div class="p-5 space-y-3 text-2xs"><div class="font-semibold text-white/80 text-sm">a1a12.com</div><div class="flex justify-between"><span class="text-white/45">Usuário</span><span>166123265</span></div><div class="flex justify-between"><span class="text-white/45">Status</span><span class="text-emerald-400">Ativa</span></div><div class="flex justify-between"><span class="text-white/45">Validade</span><span>24/06/2026</span></div><div class="flex justify-between"><span class="text-white/45">Conexões</span><span>1 / 1</span></div><div class="flex justify-between"><span class="text-white/45">Formato</span><span>TS</span></div></div>`;}
function dlList(){const D=[['O Falsário (2026)','mp4 · 2.1 GB',62,'8,4 MB/s',1],['Dupla Perigosa (2026)','mp4 · 1.7 GB',0,'Na fila',0],['Round 6 · S03E01','mkv · 780 MB',100,'Concluído',2],['Cidade em Chamas (2025)','mp4 · 2.4 GB',100,'Concluído',2]];return `<div class="divide-y divide-white/5">${D.map(([t,m,p,s,st],i)=>`<div class="flex items-center gap-3 px-4 py-2.5">${thumb(i,'h-9 w-6')}<div class="flex-1 min-w-0"><div class="flex justify-between gap-2"><span class="font-medium truncate">${t}</span><span class="text-[10px] ${st===2?'text-emerald-400':'text-white/45'}">${s}</span></div><div class="text-[10px] text-white/40 mb-1">${m}</div><div class="h-1 rounded-full bg-white/10 overflow-hidden"><div class="h-full ${st===2?'bg-emerald-400':'bg-accent'}" style="width:${p}%"></div></div></div></div>`).join('')}</div>`;}
function accountsList(){return `<div class="p-4 space-y-3"><div class="row sel rounded-lg p-3 flex items-center gap-3"><div class="h-9 w-9 rounded-lg bg-gradient-to-br from-accent to-fuchsia-500 grid place-items-center text-2xs font-bold">A1</div><div class="flex-1"><div class="font-semibold">a1a12.com</div><div class="text-[10px] text-white/45">166123265 · Ativa</div></div></div><button class="w-full border border-dashed border-white/20 rounded-lg p-3 text-white/55 hover:bg-white/5 hover:text-white transition flex items-center justify-center gap-2 text-2xs"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Adicionar conta</button></div>`;}

function nav(m){mode=m;sel=0;document.getElementById('crumb').textContent={movies:'Filmes',series:'Séries',live:'Ao vivo',downloads:'Downloads',accounts:'Contas'}[m];document.querySelectorAll('[data-side]').forEach(n=>n.classList.toggle('active',n.dataset.side===m));document.getElementById('preview').classList.toggle('hidden',false);renderList();}
function setView(v){view=v;document.getElementById('vList').className='h-6 w-7 grid place-items-center rounded-md '+(v==='list'?'bg-white/15':'text-white/50');document.getElementById('vGrid').className='h-6 w-7 grid place-items-center rounded-md '+(v==='grid'?'bg-white/15':'text-white/50');renderList();}
document.getElementById('search').addEventListener('focus',()=>{if(mode!=='movies')nav('movies');});
function openPlayer(title){document.querySelector('#player > div').innerHTML=`<div class="relative aspect-video bg-black grid place-items-center"><div class="absolute inset-0 poster opacity-40" style="background:linear-gradient(120deg,#1c3a6b,#3a1d8a)"></div><button class="relative h-16 w-16 rounded-full bg-white/90 text-black grid place-items-center shadow-2xl"><svg class="h-8 w-8 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><button onclick="closePlayer()" class="absolute top-3 right-3 h-8 w-8 rounded-full bg-black/50 hover:bg-black/70 grid place-items-center">✕</button><div class="absolute top-3 left-3 text-[11px] bg-black/50 rounded-full px-2.5 py-1 flex items-center gap-2"><span class="h-1.5 w-1.5 rounded-full bg-red-500 animate-pulse"></span>mpegts.js</div><div class="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-black/85 to-transparent"><div class="h-1 rounded-full bg-white/25 mb-2"><div class="h-full w-1/3 bg-accent rounded-full"></div></div><div class="flex items-center gap-3 text-white/85 text-2xs"><span>12:04 / 2:11:33</span><div class="flex-1"></div><span>${title}</span></div></div></div>`;document.getElementById('player').classList.remove('hidden');}
function closePlayer(){document.getElementById('player').classList.add('hidden');}
function download(title){const t=document.getElementById('toast');t.innerHTML=`⬇︎ <b>${title}</b> na fila`;t.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.add('hidden'),2400);}
buildSide();nav('movies');
</script>
</body>
</html>
