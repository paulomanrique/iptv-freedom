<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IPTV Freedom — Modelo 1 (Sidebar + Grid)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sf: ['-apple-system','BlinkMacSystemFont','SF Pro Display','Inter','system-ui','sans-serif'] },
        colors: { accent: { DEFAULT: '#0a84ff', soft: '#409cff' } },
        keyframes: {
          fadein: { '0%': { opacity: 0, transform: 'scale(.98)' }, '100%': { opacity: 1, transform: 'scale(1)' } },
        },
        animation: { fadein: 'fadein .18s ease-out' }
      }
    }
  }
</script>
<style>
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
    background:
      radial-gradient(1200px 800px at 12% 0%, #3a2b6b 0%, transparent 55%),
      radial-gradient(1000px 700px at 95% 10%, #6b2b4f 0%, transparent 50%),
      radial-gradient(900px 900px at 50% 100%, #1c3a6b 0%, transparent 55%),
      #0b0b12;
    overflow:hidden;
  }
  .vibrancy{ background:rgba(28,28,36,.62); backdrop-filter:blur(40px) saturate(180%); -webkit-backdrop-filter:blur(40px) saturate(180%); }
  .vibrancy-bar{ background:rgba(22,22,30,.55); backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%); }
  .poster{ background-size:cover; background-position:center; }
  .scroll::-webkit-scrollbar{width:8px;height:8px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
  .scroll::-webkit-scrollbar-track{background:transparent}
  .nav-item.active{ background:rgba(255,255,255,.10); }
  .nav-item.active .nav-ic{ color:#0a84ff; }
</style>
</head>
<body class="text-white/90 antialiased">

<!-- ===== Janela do app ===== -->
<div class="h-screen w-screen p-5">
  <div class="vibrancy h-full w-full rounded-2xl border border-white/10 shadow-[0_30px_80px_-20px_rgba(0,0,0,.8)] overflow-hidden flex flex-col">

    <!-- Titlebar -->
    <div class="vibrancy-bar h-12 shrink-0 flex items-center px-4 border-b border-white/10 select-none">
      <!-- traffic lights -->
      <div class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-[#ff5f57] border border-black/10"></span>
        <span class="h-3 w-3 rounded-full bg-[#febc2e] border border-black/10"></span>
        <span class="h-3 w-3 rounded-full bg-[#28c840] border border-black/10"></span>
      </div>
      <div class="flex-1 text-center text-[13px] font-semibold tracking-wide text-white/70">IPTV Freedom</div>
      <!-- search -->
      <div class="relative w-64">
        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 h-4 w-4 text-white/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="topSearch" placeholder="Buscar filmes, séries, canais…" class="w-full bg-white/10 focus:bg-white/15 rounded-lg pl-8 pr-3 py-1.5 text-[13px] placeholder:text-white/35 outline-none focus:ring-2 ring-accent/60 transition" />
      </div>
    </div>

    <!-- Corpo -->
    <div class="flex-1 flex min-h-0">

      <!-- Sidebar -->
      <aside class="w-60 shrink-0 vibrancy-bar border-r border-white/10 flex flex-col">
        <!-- conta ativa -->
        <button onclick="go('accounts')" class="m-3 mb-1 flex items-center gap-3 rounded-xl p-2.5 hover:bg-white/10 transition text-left">
          <div class="h-9 w-9 rounded-full bg-gradient-to-br from-accent to-purple-500 grid place-items-center text-sm font-bold">A1</div>
          <div class="min-w-0">
            <div class="text-[13px] font-semibold truncate">a1a12.com</div>
            <div class="text-[11px] text-emerald-400 flex items-center gap-1"><span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>Ativa · vence 24/06</div>
          </div>
        </button>

        <nav class="px-2 mt-2 space-y-0.5 text-[13px] flex-1 scroll overflow-y-auto">
          <p class="px-3 pt-2 pb-1 text-[11px] uppercase tracking-wider text-white/35">Biblioteca</p>
          <a onclick="go('home')" data-nav="home" class="nav-item active flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-white/10 cursor-pointer">
            <svg class="nav-ic h-[18px] w-[18px] text-white/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg> Início</a>
          <a onclick="go('live')" data-nav="live" class="nav-item flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-white/10 cursor-pointer">
            <svg class="nav-ic h-[18px] w-[18px] text-white/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="m8 3 4 4 4-4"/></svg> Ao vivo <span class="ml-auto text-[11px] text-white/30">312</span></a>
          <a onclick="go('movies')" data-nav="movies" class="nav-item flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-white/10 cursor-pointer">
            <svg class="nav-ic h-[18px] w-[18px] text-white/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg> Filmes <span class="ml-auto text-[11px] text-white/30">8.4k</span></a>
          <a onclick="go('series')" data-nav="series" class="nav-item flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-white/10 cursor-pointer">
            <svg class="nav-ic h-[18px] w-[18px] text-white/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M8 3 12 7 16 3"/></svg> Séries <span class="ml-auto text-[11px] text-white/30">2.1k</span></a>

          <p class="px-3 pt-4 pb-1 text-[11px] uppercase tracking-wider text-white/35">Você</p>
          <a onclick="go('search')" data-nav="search" class="nav-item flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-white/10 cursor-pointer">
            <svg class="nav-ic h-[18px] w-[18px] text-white/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg> Buscar</a>
          <a onclick="go('downloads')" data-nav="downloads" class="nav-item flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-white/10 cursor-pointer">
            <svg class="nav-ic h-[18px] w-[18px] text-white/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 21h14"/></svg> Downloads <span id="dlBadge" class="ml-auto text-[11px] bg-accent/80 text-white rounded-full px-1.5">2</span></a>
          <a onclick="go('accounts')" data-nav="accounts" class="nav-item flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-white/10 cursor-pointer">
            <svg class="nav-ic h-[18px] w-[18px] text-white/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg> Contas</a>
        </nav>

        <div class="p-3 text-[11px] text-white/30 border-t border-white/10">1 conexão · 1 ativa agora</div>
      </aside>

      <!-- Conteúdo principal -->
      <main id="main" class="flex-1 min-w-0 scroll overflow-y-auto"></main>
    </div>
  </div>
</div>

<!-- ===== Modais ===== -->
<div id="detail" class="hidden fixed inset-0 z-40 grid place-items-center p-8">
  <div class="absolute inset-0 bg-black/50" onclick="closeDetail()"></div>
  <div class="vibrancy animate-fadein relative w-full max-w-3xl rounded-2xl border border-white/10 overflow-hidden shadow-2xl"></div>
</div>

<div id="player" class="hidden fixed inset-0 z-50 grid place-items-center p-8">
  <div class="absolute inset-0 bg-black/80" onclick="closePlayer()"></div>
  <div class="animate-fadein relative w-full max-w-5xl rounded-2xl overflow-hidden border border-white/10 shadow-2xl bg-black"></div>
</div>

<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] vibrancy border border-white/10 rounded-xl px-4 py-2.5 text-[13px] shadow-2xl"></div>

<script>
/* ---------- dados fake ---------- */
const PAL = [['#7b4dff','#3a1d8a'],['#ff5f6d','#7a1f3d'],['#11998e','#0a4a47'],['#f7971e','#7a4a0a'],['#2193b0','#0a3a4a'],['#cc2b5e','#5a1230'],['#42275a','#1a0f2a'],['#005c97','#0a2a4a'],['#dd5e89','#5a2540'],['#1f4037','#0a201a']];
const titles = ['De Férias com Você','Dinheiro Suspeito','Caju, Meu Amigo','O Falsário','Verdade e Traição','Um Dia Extraordinário','Davi: Nasce Um Rei','Dupla Perigosa','Cidade em Chamas','O Último Refúgio','Noite Sem Fim','Coração Selvagem','Protocolo Zero','A Herança','Tempestade','Vingança Fria','Linha do Tempo','Submundo','Eclipse Total','Caçada Final'];
const series = ['The Crown','Ruptura','O Urso','Sucessão','Round 6','Dark','Sandman','The Last of Us','Loki','Andor'];
const live = ['Globo HD','SporTV 2','Telecine Action','HBO Max 24h','ESPN Brasil','Premiere Clubes','Discovery','Cartoon Network','GloboNews','Band Sports'];
const genres = ['Lançamentos 2026','Ação','Marvel e DC','Cinema','Terror & Suspense','Comédia','Ficção Científica'];
function poster(i,label,sub){const [a,b]=PAL[i%PAL.length];return `<div class="poster aspect-[2/3] rounded-xl ring-1 ring-white/10 relative overflow-hidden group cursor-pointer" style="background:linear-gradient(150deg,${a},${b})" onclick="openDetail('${label.replace(/'/g,"")}')">
  <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent"></div>
  <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition bg-black/40 grid place-items-center">
    <div class="h-12 w-12 rounded-full bg-white/90 text-black grid place-items-center shadow-lg"><svg class="h-6 w-6 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
  </div>
  <div class="absolute bottom-0 p-2.5"><div class="text-[12px] font-semibold leading-tight line-clamp-2">${label}</div><div class="text-[10px] text-white/55 mt-0.5">${sub}</div></div>
</div>`;}
function grid(items){return `<div class="grid grid-cols-[repeat(auto-fill,minmax(150px,1fr))] gap-4">${items}</div>`;}
function moviePosters(n=14,off=0){let s='';for(let i=0;i<n;i++){const t=titles[(i+off)%titles.length];s+=poster(i+off,t,`2026 · ${['HD','4K','1080p'][i%3]}`);}return s;}
function seriesPosters(n=10){let s='';for(let i=0;i<n;i++){s+=poster(i+3,series[i%series.length],`${1+i%5} temporadas`);}return s;}

/* ---------- views ---------- */
const views = {
  home: () => `
    <div class="relative h-72 poster" style="background:linear-gradient(120deg,#3a1d8a,#7a1f3d)">
      <div class="absolute inset-0 bg-gradient-to-t from-[rgba(28,28,36,.95)] via-[rgba(28,28,36,.3)] to-transparent"></div>
      <div class="absolute bottom-0 p-8 max-w-2xl">
        <span class="text-[11px] font-semibold uppercase tracking-widest text-accent">Em destaque</span>
        <h1 class="text-4xl font-bold mt-2">Davi: Nasce Um Rei</h1>
        <p class="text-sm text-white/70 mt-2 line-clamp-2">Épico bíblico que acompanha a ascensão do jovem pastor ao trono de Israel. Lançamento 2026 · 2h14 · 4K.</p>
        <div class="flex gap-3 mt-4">
          <button onclick="openPlayer('Davi: Nasce Um Rei')" class="bg-white text-black font-semibold rounded-lg px-5 py-2 text-sm flex items-center gap-2 hover:bg-white/90"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Assistir</button>
          <button onclick="download('Davi: Nasce Um Rei')" class="bg-white/15 hover:bg-white/25 backdrop-blur font-semibold rounded-lg px-5 py-2 text-sm flex items-center gap-2"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>Baixar</button>
        </div>
      </div>
    </div>
    <div class="p-8 space-y-8">
      ${section('Continuar assistindo', moviePosters(6,2))}
      ${section('Lançamentos 2026', moviePosters(7,0))}
      ${section('Séries populares', seriesPosters(7))}
    </div>`,
  movies: () => header('Filmes','8.412 títulos') + `<div class="px-8 pb-8">${chips(genres)}${grid(moviePosters(24))}</div>`,
  series: () => header('Séries','2.103 títulos') + `<div class="px-8 pb-8">${chips(['Netflix','Disney+','HBO Max','Prime Video','Apple TV+','Animes'])}${grid(seriesPosters(20))}</div>`,
  live: () => header('Ao vivo','312 canais') + `<div class="px-8 pb-8 grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-3">${live.concat(live).map((c,i)=>`
      <div onclick="openPlayer('${c}')" class="vibrancy-bar rounded-xl p-3 flex items-center gap-3 ring-1 ring-white/10 hover:ring-accent/60 cursor-pointer transition">
        <div class="h-11 w-11 rounded-lg grid place-items-center text-[11px] font-bold" style="background:linear-gradient(135deg,${PAL[i%PAL.length][0]},${PAL[i%PAL.length][1]})">${c.slice(0,3).toUpperCase()}</div>
        <div class="min-w-0"><div class="text-[13px] font-semibold truncate">${c}</div><div class="text-[11px] text-white/50 truncate flex items-center gap-1"><span class="h-1.5 w-1.5 rounded-full bg-red-500"></span>AO VIVO · Programação</div></div>
      </div>`).join('')}</div>`,
  search: () => header('Buscar','') + `<div class="px-8 pb-8">
      <div class="relative max-w-xl mb-6"><svg class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-white/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input autofocus placeholder="Buscar em filmes, séries e canais…" class="w-full bg-white/10 focus:bg-white/15 rounded-xl pl-11 pr-4 py-3 text-sm outline-none focus:ring-2 ring-accent/60" /></div>
      <p class="text-[13px] text-white/45 mb-3">Resultados para “2026”</p>${grid(moviePosters(18))}</div>`,
  downloads: () => header('Downloads','Fila com 1 conexão (limite do provedor)') + `<div class="px-8 pb-8 space-y-3 max-w-3xl">
      ${dlRow('O Falsário (2026)','mp4 · 2.1 GB',62,'Baixando · 8,4 MB/s',true)}
      ${dlRow('Dupla Perigosa (2026)','mp4 · 1.7 GB',0,'Na fila',false)}
      ${dlRow('Round 6 · S03E01','mkv · 780 MB',100,'Concluído',false,true)}
      ${dlRow('Cidade em Chamas (2025)','mp4 · 2.4 GB',100,'Concluído',false,true)}
    </div>`,
  accounts: () => header('Contas','Seus provedores IPTV') + `<div class="px-8 pb-8 max-w-2xl space-y-4">
      <div class="vibrancy-bar rounded-2xl p-5 ring-1 ring-accent/40">
        <div class="flex items-center gap-4">
          <div class="h-12 w-12 rounded-full bg-gradient-to-br from-accent to-purple-500 grid place-items-center font-bold">A1</div>
          <div class="flex-1"><div class="font-semibold">a1a12.com</div><div class="text-[12px] text-white/50">usuário 166123265 · saída TS</div></div>
          <span class="text-[12px] text-emerald-400 bg-emerald-400/10 rounded-full px-3 py-1">Ativa</span>
        </div>
        <div class="grid grid-cols-3 gap-3 mt-4 text-center">
          <div class="bg-white/5 rounded-xl py-3"><div class="text-lg font-bold">24/06/26</div><div class="text-[11px] text-white/45">Validade</div></div>
          <div class="bg-white/5 rounded-xl py-3"><div class="text-lg font-bold">1 / 1</div><div class="text-[11px] text-white/45">Conexões</div></div>
          <div class="bg-white/5 rounded-xl py-3"><div class="text-lg font-bold">TS</div><div class="text-[11px] text-white/45">Formato</div></div>
        </div>
      </div>
      <button class="w-full border border-dashed border-white/20 rounded-2xl p-5 text-white/55 hover:bg-white/5 hover:text-white/80 transition flex items-center justify-center gap-2 text-sm"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Adicionar conta (host · usuário · senha)</button>
    </div>`
};
function header(t,s){return `<div class="px-8 pt-8 pb-4 sticky top-0 vibrancy z-10"><h1 class="text-3xl font-bold">${t}</h1>${s?`<p class="text-[13px] text-white/45 mt-1">${s}</p>`:''}</div>`;}
function section(t,inner){return `<div><div class="flex items-center justify-between mb-3"><h2 class="text-lg font-semibold">${t}</h2><button class="text-[12px] text-accent hover:underline">Ver tudo</button></div>${grid(inner)}</div>`;}
function chips(arr){return `<div class="flex flex-wrap gap-2 mb-5">${arr.map((g,i)=>`<button class="px-3.5 py-1.5 rounded-full text-[12px] font-medium ${i===0?'bg-white text-black':'bg-white/10 hover:bg-white/20'} transition">${g}</button>`).join('')}</div>`;}
function dlRow(t,meta,pct,status,active,done){return `<div class="vibrancy-bar rounded-xl p-4 ring-1 ring-white/10 flex items-center gap-4">
  <div class="h-12 w-9 rounded-md shrink-0" style="background:linear-gradient(135deg,${PAL[t.length%PAL.length][0]},${PAL[t.length%PAL.length][1]})"></div>
  <div class="flex-1 min-w-0">
    <div class="flex items-center justify-between gap-3"><div class="text-[13px] font-semibold truncate">${t}</div><div class="text-[11px] ${done?'text-emerald-400':'text-white/45'} shrink-0">${status}</div></div>
    <div class="text-[11px] text-white/40 mb-2">${meta}</div>
    <div class="h-1.5 rounded-full bg-white/10 overflow-hidden"><div class="h-full ${done?'bg-emerald-400':'bg-accent'}" style="width:${pct}%"></div></div>
  </div>
  <button class="h-8 w-8 grid place-items-center rounded-lg hover:bg-white/10 text-white/60">${done?'<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h6l2-9 4 18 2-9h6"/></svg>':active?'<svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>':'<svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'}</button>
</div>`;}

/* ---------- navegação ---------- */
function go(v){
  document.getElementById('main').innerHTML = views[v]();
  document.getElementById('main').scrollTop = 0;
  document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active', n.dataset.nav===v));
}
document.getElementById('topSearch').addEventListener('focus',()=>go('search'));

/* ---------- detalhe ---------- */
function openDetail(title){
  const [a,b]=PAL[title.length%PAL.length];
  const box=document.querySelector('#detail > div');
  box.innerHTML=`
    <div class="relative h-56 poster" style="background:linear-gradient(120deg,${a},${b})">
      <div class="absolute inset-0 bg-gradient-to-t from-[rgba(28,28,36,.97)] to-transparent"></div>
      <button onclick="closeDetail()" class="absolute top-3 right-3 h-8 w-8 rounded-full bg-black/40 hover:bg-black/60 grid place-items-center">✕</button>
    </div>
    <div class="p-7 -mt-16 relative">
      <h2 class="text-3xl font-bold">${title}</h2>
      <div class="flex items-center gap-3 text-[12px] text-white/55 mt-2"><span class="text-emerald-400">96% relevante</span><span>2026</span><span>2h 11min</span><span class="border border-white/20 rounded px-1.5">4K</span><span>Ação · Suspense</span></div>
      <p class="text-sm text-white/70 mt-4 max-w-2xl">Um thriller eletrizante onde cada escolha tem um preço. Produção de alto orçamento com elenco premiado, disponível em 4K Dolby Vision.</p>
      <div class="flex gap-3 mt-6">
        <button onclick="openPlayer('${title}')" class="bg-white text-black font-semibold rounded-lg px-6 py-2.5 text-sm flex items-center gap-2 hover:bg-white/90"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Assistir</button>
        <button onclick="download('${title}')" class="bg-white/15 hover:bg-white/25 font-semibold rounded-lg px-6 py-2.5 text-sm flex items-center gap-2"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>Baixar arquivo</button>
        <button class="h-11 w-11 grid place-items-center rounded-lg bg-white/10 hover:bg-white/20"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <p class="text-[11px] text-white/35 mt-4">⚠︎ Sua conta permite 1 conexão. Baixar e assistir ao mesmo tempo não é possível.</p>
    </div>`;
  document.getElementById('detail').classList.remove('hidden');
}
function closeDetail(){document.getElementById('detail').classList.add('hidden');}

/* ---------- player ---------- */
function openPlayer(title){
  closeDetail();
  const box=document.querySelector('#player > div');
  box.innerHTML=`
    <div class="relative aspect-video bg-black grid place-items-center">
      <div class="absolute inset-0 poster opacity-40" style="background:linear-gradient(120deg,#1c3a6b,#3a1d8a)"></div>
      <button class="relative h-20 w-20 rounded-full bg-white/90 text-black grid place-items-center shadow-2xl hover:scale-105 transition"><svg class="h-10 w-10 ml-1" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button onclick="closePlayer()" class="absolute top-3 right-3 h-9 w-9 rounded-full bg-black/50 hover:bg-black/70 grid place-items-center">✕</button>
      <div class="absolute top-4 left-4 text-[12px] bg-black/50 rounded-full px-3 py-1 flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>mpegts.js · MSE</div>
      <!-- controles -->
      <div class="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-black/80 to-transparent">
        <div class="h-1 rounded-full bg-white/25 mb-3"><div class="h-full w-1/3 bg-accent rounded-full"></div></div>
        <div class="flex items-center gap-4 text-white/85">
          <button><svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM10 12l9-6v12z"/></svg></button>
          <button><svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
          <span class="text-[12px] tabular-nums">12:04 / 2:11:33</span>
          <div class="flex-1"></div>
          <span class="text-[12px]">${title}</span>
          <button><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V3h4M21 7V3h-4M3 17v4h4M21 17v4h-4"/></svg></button>
        </div>
      </div>
    </div>`;
  document.getElementById('player').classList.remove('hidden');
}
function closePlayer(){document.getElementById('player').classList.add('hidden');}

/* ---------- toast ---------- */
function download(title){
  const t=document.getElementById('toast');
  t.innerHTML=`⬇︎ <b>${title}</b> adicionado à fila de downloads`;
  t.classList.remove('hidden');
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.add('hidden'),2600);
}

go('home');
</script>
