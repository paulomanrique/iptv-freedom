<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IPTV Freedom — Modelo 3 (Dashboard)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{accent:'#0a84ff'},keyframes:{fadein:{'0%':{opacity:0,transform:'translateY(6px)'},'100%':{opacity:1,transform:'translateY(0)'}}},animation:{fadein:'fadein .2s ease-out'}}}}</script>
<style>
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;overflow:hidden;
    background:radial-gradient(1000px 700px at 0% 0%,#26304d 0%,transparent 50%),radial-gradient(900px 700px at 100% 100%,#3d2542 0%,transparent 50%),#0a0c12}
  .glass{background:rgba(20,22,30,.55);backdrop-filter:blur(36px) saturate(180%);-webkit-backdrop-filter:blur(36px) saturate(180%)}
  .glass2{background:rgba(255,255,255,.045);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .rail-ic.active{background:rgba(10,132,255,.18);color:#409cff}
  .poster{background-size:cover;background-position:center}
  .scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:8px}.scroll::-webkit-scrollbar-track{background:transparent}
  .rail{scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
</style>
</head>
<body class="text-white/90 antialiased">

<div class="h-screen w-screen p-4">
  <div class="glass h-full w-full rounded-[20px] border border-white/10 shadow-[0_40px_100px_-20px_rgba(0,0,0,.9)] overflow-hidden flex">

    <!-- Rail de ícones -->
    <nav class="w-[72px] shrink-0 border-r border-white/10 flex flex-col items-center py-4 gap-1">
      <div class="flex flex-col gap-1.5 mb-4">
        <span class="h-3 w-3 rounded-full bg-[#ff5f57]"></span><span class="h-3 w-3 rounded-full bg-[#febc2e]"></span><span class="h-3 w-3 rounded-full bg-[#28c840]"></span>
      </div>
      ${''/* nav buttons injected below via JS for active state */}
      <div id="rail" class="flex flex-col gap-1 flex-1"></div>
      <button onclick="go('accounts')" class="h-11 w-11 rounded-2xl bg-gradient-to-br from-accent to-fuchsia-500 grid place-items-center text-[12px] font-bold">A1</button>
    </nav>

    <main id="main" class="flex-1 min-w-0 scroll overflow-y-auto"></main>
  </div>
</div>

<div id="detail" class="hidden fixed inset-0 z-40 grid place-items-center p-8"><div class="absolute inset-0 bg-black/55" onclick="closeDetail()"></div><div class="relative w-full max-w-3xl rounded-2xl overflow-hidden border border-white/10 shadow-2xl glass animate-fadein"></div></div>
<div id="player" class="hidden fixed inset-0 z-50 grid place-items-center p-6"><div class="absolute inset-0 bg-black/85" onclick="closePlayer()"></div><div class="relative w-full max-w-5xl rounded-2xl overflow-hidden border border-white/10 shadow-2xl bg-black animate-fadein"></div></div>
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] glass border border-white/10 rounded-xl px-4 py-2.5 text-[13px] shadow-2xl"></div>

<script>
const PAL=[['#7b4dff','#3a1d8a'],['#ff5f6d','#7a1f3d'],['#11998e','#0a4a47'],['#f7971e','#7a4a0a'],['#2193b0','#0a3a4a'],['#cc2b5e','#5a1230'],['#42275a','#1a0f2a'],['#005c97','#0a2a4a'],['#dd5e89','#5a2540'],['#1f4037','#0a201a']];
const titles=['De Férias com Você','Dinheiro Suspeito','Caju, Meu Amigo','O Falsário','Verdade e Traição','Um Dia Extraordinário','Davi: Nasce Um Rei','Dupla Perigosa','Cidade em Chamas','O Último Refúgio','Noite Sem Fim','Coração Selvagem','Protocolo Zero','A Herança'];
const series=['The Crown','Ruptura','O Urso','Sucessão','Round 6','Dark','Sandman','The Last of Us'];
const live=['Globo HD','SporTV 2','Telecine','HBO Max','ESPN','Premiere','Discovery','GloboNews'];
const NAV=[['home','Início','M3 9.5 12 3l9 6.5M5 10v10h14V10'],['movies','Filmes','M3 4h18v16H3zM7 4v16M17 4v16'],['series','Séries','M2 7h20v13H2zM8 3l4 4 4-4'],['live','Ao vivo','M2 7h20v13H2zm6-4 4 4 4-4'],['search','Buscar','m21 21-4.3-4.3'],['downloads','Downloads','M12 3v12m0 0 4-4m-4 4-4-4M5 21h14']];

function ic(p){return `<svg class="h-[22px] w-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p.split('M').filter(Boolean).map(d=>'<path d="M'+d+'"/>').join('')}</svg>`;}
function buildRail(){document.getElementById('rail').innerHTML=NAV.map(([k,label,p])=>`
  <button onclick="go('${k}')" data-rail="${k}" title="${label}" class="rail-ic group relative h-11 w-11 rounded-2xl grid place-items-center text-white/60 hover:text-white hover:bg-white/10 transition">
    ${ic(p)}<span class="absolute left-14 px-2 py-1 rounded-md bg-black/80 text-[12px] opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap z-50">${label}</span>
    ${k==='downloads'?'<span class="absolute -top-0.5 -right-0.5 h-4 min-w-4 px-1 text-[10px] bg-accent rounded-full grid place-items-center">2</span>':''}
  </button>`).join('');}

function poster(i,label,sub,h){const[a,b]=PAL[i%PAL.length];return `<div onclick="openDetail('${label.replace(/'/g,'')}')" class="poster ${h||'aspect-[2/3]'} min-w-[150px] rounded-2xl ring-1 ring-white/10 relative overflow-hidden group cursor-pointer shrink-0 transition hover:ring-white/30" style="background:linear-gradient(150deg,${a},${b})">
  <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
  <div class="absolute inset-0 opacity-0 group-hover:opacity-100 bg-black/30 grid place-items-center transition"><div class="h-11 w-11 rounded-full bg-white/90 text-black grid place-items-center"><svg class="h-5 w-5 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div></div>
  <div class="absolute bottom-0 p-2.5"><div class="text-[12px] font-semibold leading-tight line-clamp-2">${label}</div><div class="text-[10px] text-white/55">${sub}</div></div></div>`;}
function movies(n,off=0){let s='';for(let i=0;i<n;i++)s+=poster(i+off,titles[(i+off)%titles.length],`2026 · ${['4K','HD'][i%2]}`);return s;}
function seriesC(n){let s='';for(let i=0;i<n;i++)s+=poster(i+3,series[i%series.length],`${1+i%5} temporadas`);return s;}
function rail(items){return `<div class="rail flex gap-3.5 overflow-x-auto pb-1">${items}</div>`;}
function gridW(items){return `<div class="grid grid-cols-[repeat(auto-fill,minmax(150px,1fr))] gap-4">${items}</div>`;}

const views={
  home:()=>`<div class="p-7 space-y-7 animate-fadein">
    <!-- topo: saudação + busca -->
    <div class="flex items-center justify-between">
      <div><div class="text-[13px] text-white/45">Bem-vindo de volta</div><h1 class="text-2xl font-bold">Sua biblioteca</h1></div>
      <div class="relative w-72"><svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-white/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input onfocus="go('search')" placeholder="Buscar…" class="w-full glass2 rounded-xl pl-9 pr-3 py-2 text-[13px] outline-none focus:ring-2 ring-accent/60"/></div>
    </div>

    <!-- spotlight + widget conta -->
    <div class="grid grid-cols-3 gap-5">
      <div class="col-span-2 relative h-64 rounded-2xl overflow-hidden poster" style="background:linear-gradient(120deg,#3a1d8a,#7a1f3d)">
        <div class="absolute inset-0 bg-gradient-to-tr from-black/85 to-transparent"></div>
        <div class="absolute bottom-0 p-6 max-w-sm"><span class="text-[11px] font-bold uppercase tracking-widest text-accent">Destaque</span><h2 class="text-3xl font-bold mt-1">Davi: Nasce Um Rei</h2><p class="text-[13px] text-white/65 mt-1.5 line-clamp-2">Épico bíblico em 4K · lançamento 2026.</p>
        <div class="flex gap-2.5 mt-4"><button onclick="openPlayer('Davi: Nasce Um Rei')" class="bg-white text-black font-semibold rounded-lg px-5 py-2 text-[13px] flex items-center gap-2"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Assistir</button><button onclick="download('Davi: Nasce Um Rei')" class="glass2 hover:bg-white/15 font-semibold rounded-lg px-5 py-2 text-[13px] flex items-center gap-2"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>Baixar</button></div></div>
      </div>
      <div class="glass2 rounded-2xl p-5 flex flex-col">
        <div class="flex items-center gap-3"><div class="h-10 w-10 rounded-full bg-gradient-to-br from-accent to-fuchsia-500 grid place-items-center text-[12px] font-bold">A1</div><div><div class="text-[14px] font-semibold">a1a12.com</div><div class="text-[11px] text-emerald-400">● Ativa</div></div></div>
        <div class="mt-4 space-y-3 text-[13px] flex-1">
          <div class="flex justify-between"><span class="text-white/45">Validade</span><span class="font-semibold">24/06/2026</span></div>
          <div class="flex justify-between"><span class="text-white/45">Conexões</span><span class="font-semibold">1 / 1</span></div>
          <div class="flex justify-between"><span class="text-white/45">Formato</span><span class="font-semibold">TS</span></div>
          <div><div class="flex justify-between text-[11px] text-white/45 mb-1"><span>Dias restantes</span><span>24</span></div><div class="h-1.5 rounded-full bg-white/10 overflow-hidden"><div class="h-full bg-emerald-400" style="width:65%"></div></div></div>
        </div>
        <button onclick="go('accounts')" class="mt-3 text-[12px] text-accent hover:underline text-left">Gerenciar contas ›</button>
      </div>
    </div>

    ${block('Continuar assistindo', rail(movies(7,2)))}
    ${block('Lançamentos 2026', rail(movies(9,0)))}
    ${block('Séries populares', rail(seriesC(8)))}
  </div>`,
  movies:()=>head('Filmes','8.412 títulos')+`<div class="px-7 pb-8">${chips(['Lançamentos 2026','Ação','Marvel e DC','Cinema','Terror','Comédia'])}${gridW(movies(24))}</div>`,
  series:()=>head('Séries','2.103 títulos')+`<div class="px-7 pb-8">${chips(['Netflix','Disney+','HBO Max','Prime','Apple TV+','Animes'])}${gridW(seriesC(20))}</div>`,
  live:()=>head('Ao vivo','312 canais')+`<div class="px-7 pb-8 grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-3">${live.concat(live).map((c,i)=>`<div onclick="openPlayer('${c}')" class="glass2 rounded-xl p-3 flex items-center gap-3 hover:ring-1 ring-accent/60 cursor-pointer transition"><div class="h-11 w-11 rounded-lg grid place-items-center text-[11px] font-bold" style="background:linear-gradient(135deg,${PAL[i%PAL.length][0]},${PAL[i%PAL.length][1]})">${c.slice(0,3).toUpperCase()}</div><div class="min-w-0 flex-1"><div class="text-[13px] font-semibold truncate">${c}</div><div class="text-[11px] text-white/50 flex items-center gap-1"><span class="h-1.5 w-1.5 rounded-full bg-red-500"></span>AO VIVO</div></div></div>`).join('')}</div>`,
  search:()=>head('Buscar','')+`<div class="px-7 pb-8"><div class="relative max-w-xl mb-6"><svg class="absolute left-3.5 top-1/2 -translate-y-1/2 h-5 w-5 text-white/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input autofocus placeholder="Buscar filmes, séries, canais…" class="w-full glass2 rounded-xl pl-11 pr-4 py-3 text-[14px] outline-none focus:ring-2 ring-accent/60"/></div><p class="text-[13px] text-white/45 mb-3">Resultados</p>${gridW(movies(18))}</div>`,
  downloads:()=>head('Downloads','Fila · 1 conexão (limite do provedor)')+`<div class="px-7 pb-8 max-w-3xl space-y-3">${dl('O Falsário (2026)','mp4 · 2.1 GB',62,'8,4 MB/s',1)}${dl('Dupla Perigosa (2026)','mp4 · 1.7 GB',0,'Na fila',0)}${dl('Round 6 · S03E01','mkv · 780 MB',100,'Concluído',2)}${dl('Cidade em Chamas (2025)','mp4 · 2.4 GB',100,'Concluído',2)}</div>`,
  accounts:()=>head('Contas','Provedores IPTV')+`<div class="px-7 pb-8 max-w-2xl space-y-4"><div class="glass2 rounded-2xl p-6 ring-1 ring-accent/40"><div class="flex items-center gap-4"><div class="h-13 w-13 h-12 w-12 rounded-2xl bg-gradient-to-br from-accent to-fuchsia-500 grid place-items-center font-bold">A1</div><div class="flex-1"><div class="font-bold text-lg">a1a12.com</div><div class="text-[12px] text-white/50">usuário 166123265</div></div><span class="text-[12px] text-emerald-400 bg-emerald-400/10 rounded-full px-3 py-1">Ativa</span></div><div class="grid grid-cols-3 gap-3 mt-5"><div class="bg-white/5 rounded-xl py-4 text-center"><div class="text-lg font-bold">24/06/26</div><div class="text-[11px] text-white/45">Validade</div></div><div class="bg-white/5 rounded-xl py-4 text-center"><div class="text-lg font-bold">1 / 1</div><div class="text-[11px] text-white/45">Conexões</div></div><div class="bg-white/5 rounded-xl py-4 text-center"><div class="text-lg font-bold">TS</div><div class="text-[11px] text-white/45">Formato</div></div></div></div><button class="w-full border border-dashed border-white/20 rounded-2xl p-6 text-white/55 hover:bg-white/5 hover:text-white transition flex items-center justify-center gap-2 text-[14px]"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Adicionar conta</button></div>`
};
function head(t,s){return `<div class="px-7 pt-8 pb-4"><h1 class="text-3xl font-bold">${t}</h1>${s?`<p class="text-[13px] text-white/45 mt-1">${s}</p>`:''}</div>`;}
function block(t,inner){return `<div><div class="flex items-center justify-between mb-3"><h2 class="text-[17px] font-semibold">${t}</h2><button class="text-[12px] text-accent hover:underline">Ver tudo</button></div>${inner}</div>`;}
function chips(a){return `<div class="flex flex-wrap gap-2 mb-5">${a.map((g,i)=>`<button class="px-3.5 py-1.5 rounded-full text-[12px] font-medium ${i===0?'bg-white text-black':'glass2 hover:bg-white/15'} transition">${g}</button>`).join('')}</div>`;}
function dl(t,m,p,s,st){return `<div class="glass2 rounded-xl p-4 flex items-center gap-4"><div class="h-12 w-9 rounded-md shrink-0" style="background:linear-gradient(135deg,${PAL[t.length%PAL.length][0]},${PAL[t.length%PAL.length][1]})"></div><div class="flex-1 min-w-0"><div class="flex justify-between gap-3"><span class="text-[13px] font-semibold truncate">${t}</span><span class="text-[11px] ${st===2?'text-emerald-400':'text-white/45'} shrink-0">${s}</span></div><div class="text-[11px] text-white/40 mb-2">${m}</div><div class="h-1.5 rounded-full bg-white/10 overflow-hidden"><div class="h-full ${st===2?'bg-emerald-400':'bg-accent'}" style="width:${p}%"></div></div></div><button class="h-8 w-8 grid place-items-center rounded-lg hover:bg-white/10 text-white/60">${st===2?'✓':st===1?'<svg class=\\'h-4 w-4\\' viewBox=\\'0 0 24 24\\' fill=\\'currentColor\\'><path d=\\'M6 5h4v14H6zM14 5h4v14h-4z\\'/></svg>':'▶'}</button></div>`;}

function go(v){document.getElementById('main').innerHTML=views[v]();document.getElementById('main').scrollTop=0;document.querySelectorAll('[data-rail]').forEach(n=>n.classList.toggle('active',n.dataset.rail===v));}
function openDetail(title){const[a,b]=PAL[title.length%PAL.length];document.querySelector('#detail > div').innerHTML=`<div class="relative h-52 poster" style="background:linear-gradient(120deg,${a},${b})"><div class="absolute inset-0 bg-gradient-to-t from-[rgba(20,22,30,.98)] to-transparent"></div><button onclick="closeDetail()" class="absolute top-3 right-3 h-8 w-8 rounded-full bg-black/40 hover:bg-black/60 grid place-items-center">✕</button></div><div class="p-7 -mt-16 relative"><h2 class="text-3xl font-bold">${title}</h2><div class="flex items-center gap-3 text-[12px] text-white/55 mt-2"><span class="text-emerald-400">96%</span><span>2026</span><span>2h11</span><span class="border border-white/20 rounded px-1.5">4K</span></div><p class="text-sm text-white/70 mt-4 max-w-2xl">Thriller eletrizante em 4K Dolby Vision.</p><div class="flex gap-3 mt-6"><button onclick="openPlayer('${title}')" class="bg-white text-black font-semibold rounded-lg px-6 py-2.5 text-sm flex items-center gap-2"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Assistir</button><button onclick="download('${title}')" class="bg-white/15 hover:bg-white/25 font-semibold rounded-lg px-6 py-2.5 text-sm flex items-center gap-2"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>Baixar arquivo</button></div><p class="text-[11px] text-white/35 mt-4">⚠︎ 1 conexão — assistir e baixar simultâneo indisponível.</p></div>`;document.getElementById('detail').classList.remove('hidden');}
function closeDetail(){document.getElementById('detail').classList.add('hidden');}
function openPlayer(title){closeDetail();document.querySelector('#player > div').innerHTML=`<div class="relative aspect-video bg-black grid place-items-center"><div class="absolute inset-0 poster opacity-40" style="background:linear-gradient(120deg,#1c3a6b,#3a1d8a)"></div><button class="relative h-20 w-20 rounded-full bg-white/90 text-black grid place-items-center shadow-2xl hover:scale-105 transition"><svg class="h-10 w-10 ml-1" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><button onclick="closePlayer()" class="absolute top-3 right-3 h-9 w-9 rounded-full bg-black/50 hover:bg-black/70 grid place-items-center">✕</button><div class="absolute top-4 left-4 text-[12px] bg-black/50 rounded-full px-3 py-1 flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>mpegts.js · MSE</div><div class="absolute bottom-0 inset-x-0 p-5 bg-gradient-to-t from-black/85 to-transparent"><div class="h-1 rounded-full bg-white/25 mb-3"><div class="h-full w-1/3 bg-accent rounded-full"></div></div><div class="flex items-center gap-4 text-white/85"><button><svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><span class="text-[12px] tabular-nums">12:04 / 2:11:33</span><div class="flex-1"></div><span class="text-[13px]">${title}</span></div></div></div>`;document.getElementById('player').classList.remove('hidden');}
function closePlayer(){document.getElementById('player').classList.add('hidden');}
function download(title){const t=document.getElementById('toast');t.innerHTML=`⬇︎ <b>${title}</b> adicionado à fila`;t.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.add('hidden'),2600);}
buildRail();go('home');
</script>
</body>
</html>
