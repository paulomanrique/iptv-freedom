name: Release

# Runs only when a "v*" tag is pushed (e.g. v0.0.1).
# Does not run on pull requests or branch pushes.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive version from tag (strip leading "v")
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build renderer/main/preload
        run: pnpm --filter desktop build

      - name: Install Linux packaging tools (rpm)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Package installers (x64 + arm64)
        working-directory: apps/desktop
        env:
          # We do not sign the macOS binaries in CI.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm exec electron-builder --${{ matrix.platform }} --x64 --arm64 --publish never -c.extraMetadata.version="$APP_VERSION"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
          if-no-files-found: ignore
          retention-days: 5

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          # Pre-release tags contain a hyphen (e.g. v0.2.0-rc.1); clean vX.Y.Z tags are full releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
